@if (isVisible) {
    <button type="button" (click)="scrollToTop()" aria-label="Scroll to top" [class.right-4]="languageService.language() === 'en'" [class.left-4]="languageService.language() === 'fa'" class="fixed bottom-4 z-40 flex size-11 items-center justify-center rounded-full border border-black/10 bg-white/90 text-violet-600 shadow-lg backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:bg-violet-600 hover:text-white dark:border-white/10 dark:bg-[#050816]/90 dark:text-violet-400 dark:hover:bg-violet-600 dark:hover:text-white sm:bottom-5 sm:size-11" >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
    </button>
}
